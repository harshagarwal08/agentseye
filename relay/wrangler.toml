name = "agentseye"
main = "worker.js"
compatibility_date = "2026-10-01"

# The phone app, served by the relay itself (see core.js: Macs never serve scripts on the shared origin).
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[durable_objects.bindings]]
name = "MACS"
class_name = "MacRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MacRoom"]

# The GitHub repository install.sh downloads AgentsEye from (owner/name).
[vars]
REPO = "harshagarwal08/agentseye"
# This is the public, shared relay: each Mac gets this many phone requests a day (an open phone app makes ~25 a
# minute), so nobody can use up the free Cloudflare quota for everyone. Personal relays made with
# `agentseye relay deploy` have no limit. Set to "0" to turn it off.
MAC_DAILY_LIMIT = "6000"
