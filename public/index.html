<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AgentsEye">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <title>AgentsEye</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="gate" class="gate" hidden></div>
  <div id="app" class="app" hidden>
    <nav class="tabs" id="tabs">
      <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>AgentsEye</span></div>
      <a href="#/" data-tab="home"><span class="ti">◉</span><span>Agents</span><b class="pip" id="pip-home"></b></a>
      <a href="#/settings" data-tab="settings"><span class="ti">⚙</span><span>Settings</span><b class="pip" id="pip-settings"></b></a>
    </nav>
    <main id="view"></main>
  </div>
  <div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheet-card"></div></div>
  <div id="conn" class="conn" hidden role="status" aria-live="polite"></div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
